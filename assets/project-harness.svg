<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="350" viewBox="0 0 1610 350" role="img" aria-labelledby="title description" data-graph-id="project-harness-flow" data-package-id="project-harness">
  <title id="title">Project Harness conceptual flow</title>
  <desc id="description">Skill trigger then Initializer then Local context then Work cycle then Finalizer then Durable next. This is an operating sequence, not a ranking.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .surface { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .heading { fill: #111827; font: 600 18px ui-sans-serif, system-ui, sans-serif; }
    .step { fill: #111827; font: 600 15px ui-sans-serif, system-ui, sans-serif; }
    .meta { fill: #475569; font: 13px ui-monospace, SFMono-Regular, monospace; }
    .link { fill: #1d4ed8; font: 600 13px ui-sans-serif, system-ui, sans-serif; text-decoration: underline; }
  </style>
  <text class="heading" x="40" y="38">Project Harness conceptual flow</text>
  <text class="meta" x="40" y="66">project-harness · graph project-harness-flow</text>
  <path class="edge" d="M 270 190 L 292 190"/>
  <path class="edge" d="M 530 190 L 552 190"/>
  <path class="edge" d="M 790 190 L 812 190"/>
  <path class="edge" d="M 1050 190 L 1072 190"/>
  <path class="edge" d="M 1310 190 L 1332 190"/>
  <g aria-label="Step 1: Skill trigger. Select the project-local operating contract.">
    <rect class="surface" x="40" y="115" width="230" height="150" rx="14"/>
    <text class="meta" x="60" y="145">Step 1</text>
    <text class="step" x="60" y="185">
      <tspan x="60" dy="0">Skill trigger</tspan>
    </text>
  </g>
  <g aria-label="Step 2: Initializer. Preview and create the bounded managed structure.">
    <rect class="surface" x="300" y="115" width="230" height="150" rx="14"/>
    <text class="meta" x="320" y="145">Step 2</text>
    <text class="step" x="320" y="185">
      <tspan x="320" dy="0">Initializer</tspan>
    </text>
  </g>
  <g aria-label="Step 3: Local context. Open durable project context and current state.">
    <rect class="surface" x="560" y="115" width="230" height="150" rx="14"/>
    <text class="meta" x="580" y="145">Step 3</text>
    <text class="step" x="580" y="185">
      <tspan x="580" dy="0">Local context</tspan>
    </text>
  </g>
  <g aria-label="Step 4: Work cycle. Digest, checkpoint, and continue one bounded project cycle.">
    <rect class="surface" x="820" y="115" width="230" height="150" rx="14"/>
    <text class="meta" x="840" y="145">Step 4</text>
    <text class="step" x="840" y="185">
      <tspan x="840" dy="0">Work cycle</tspan>
    </text>
  </g>
  <g aria-label="Step 5: Finalizer. Close the work block with explicit recorded content.">
    <rect class="surface" x="1080" y="115" width="230" height="150" rx="14"/>
    <text class="meta" x="1100" y="145">Step 5</text>
    <text class="step" x="1100" y="185">
      <tspan x="1100" dy="0">Finalizer</tspan>
    </text>
  </g>
  <g aria-label="Step 6: Durable next. Reopen from the persisted next action.">
    <rect class="surface" x="1340" y="115" width="230" height="150" rx="14"/>
    <text class="meta" x="1360" y="145">Step 6</text>
    <text class="step" x="1360" y="185">
      <tspan x="1360" dy="0">Durable next</tspan>
    </text>
  </g>
  <text class="meta" x="40" y="320">0.2.3 · implemented · published</text>
  <a href="https://fabianomag.com/projects/agent-harnesses" aria-label="Open the interactive Project Harness diagram">
    <text class="link" x="40" y="345">Interactive diagram</text>
  </a>
</svg>
